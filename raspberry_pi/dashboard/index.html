<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <title>Vogelhuisje Live</title>
    <style>
        body { font-family: system-ui, sans-serif; background: #111; color: #eee; padding: 20px; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; max-width: 1100px; margin: auto; }
        .card { background: #222; border-radius: 12px; padding: 20px; }
        .label { color: #888; text-transform: uppercase; font-size: .75em; letter-spacing: 1px; }
        .big { font-size: 3em; font-weight: 700; color: #4CAF50; }
        .value { font-size: 2em; color: #4fc3f7; }
        img { width: 100%; border-radius: 8px; display: block; }
        @media(max-width:700px){ .grid { grid-template-columns: 1fr; } }
        a { color: #4CAF50; text-decoration: none; font-weight: bold; }
        a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <h1>Vogelhuisje Live</h1>
    <p><a href="/geschiedenis">Bekijk Geschiedenis &rarr;</a></p>
    <div class="grid">
        <div class="card"><div class="label">Gewicht</div><div class="big" id="weight">-- g</div></div>
        <div class="card"><div class="label">Temperatuur</div><div class="value" id="temp">-- °C</div></div>
        <div class="card"><div class="label">Luchtvochtigheid</div><div class="value" id="humidity">-- %</div></div>
        <div class="card"><div class="label">Servo positie</div><div class="value" id="servo">-- °</div></div>
        <div class="card" style="grid-column:1/-1">
            <div class="label">Camera</div>
            <img src="/video_feed" alt="camera">
        </div>
    </div>
    <script>
        async function update() {
            try {
                const response = await fetch('/api/data');
                const d = await response.json();
                if (d.error) return;
                if (d.scale_ready) {
                    document.getElementById('weight').textContent = d.weight.toFixed(1) + ' g';
                } else {
                    document.getElementById('weight').textContent = 'niet gedetecteerd';
                }
                document.getElementById('temp').textContent = d.temp ? d.temp.toFixed(1) + ' °C' : '-- °C';
                document.getElementById('humidity').textContent = d.humidity ? d.humidity.toFixed(1) + ' %' : '-- %';
            } catch (e) { console.error(e); } finally { setTimeout(update, 1000); }
        }
        update();
    </script>
</body>
</html>
